services:
    app:
        build: .
        container_name: rui-app
        restart: unless-stopped
        env_file:
           - .config.env
        expose:
            - "3000"

    nginx:
        image: nginx:alpine
        container_name: rui-nginx
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app